# MITS — deployable as a Portainer stack straight from the repository.
#
# ZERO CONFIG: no variable has to be set. Leave Portainer's "Environment
# variables" section empty and hit Deploy.
#
#   * Both secrets are GENERATED on first start and kept in the mits-data volume,
#     so every instance gets its own. No default secret is shipped in this file —
#     a constant here would let anyone who read the repository forge an admin
#     session on any instance that never overrode it.
#   * Ollama's address and both model names are configured in the UI under
#     /admin/settings/ai. The OLLAMA_* entries below are only first-boot
#     fallbacks; if Ollama runs on the Docker host, the default already fits
#     thanks to the extra_hosts mapping.
#
# Every variable below is therefore optional. Set one only to override.

services:
  mits-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mits-web:local
    container_name: mits-web
    restart: unless-stopped
    ports:
      - "${MITS_WEB_PORT:-3000}:3000"
    environment:
      # Signs session cookies. Unset: generated once into
      # /app/data/auth-secret, so sessions survive restarts and redeploys.
      # Override with `openssl rand -hex 32` if several instances share a volume.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # Shared secret with mits-backend. Unset: generated once into
      # /app/data/service-token, which the backend mounts read-only.
      MITS_SERVICE_TOKEN: ${MITS_SERVICE_TOKEN:-}
      # Public URL of this instance, e.g. https://mits.firma.de. Only needed
      # behind a proxy that rewrites Host.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      MITS_TRUSTED_ORIGINS: ${MITS_TRUSTED_ORIGINS:-}
      # Service name, not localhost: this is the compose network.
      MITS_BACKEND_URL: http://mits-backend:8000
      MITS_DATA_DIR: /app/data
    volumes:
      # Survives image rebuilds — users, sessions, tickets, uploads, settings and
      # the generated secrets all live here.
      - mits-data:/app/data
    depends_on:
      mits-backend:
        condition: service_started

  mits-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: mits-backend:local
    container_name: mits-backend
    restart: unless-stopped
    # No `ports`: the AI endpoint is reachable only from mits-web inside the
    # stack. Publishing it would put an endpoint that can be pointed at arbitrary
    # hosts onto the host network.
    environment:
      MITS_SERVICE_TOKEN: ${MITS_SERVICE_TOKEN:-}
      # Read when MITS_SERVICE_TOKEN is unset — the token the web app generated.
      MITS_SERVICE_TOKEN_FILE: /app/data/service-token
      # First-boot fallbacks only; the effective values arrive with each request
      # from the settings the admin saved in the UI.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.1}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    volumes:
      # Read-only: the backend only needs to read the generated token. It must
      # never write to the database or the uploads.
      - mits-data:/app/data:ro
    extra_hosts:
      # Lets OLLAMA_BASE_URL point at an Ollama running on the Docker host.
      - "host.docker.internal:host-gateway"

volumes:
  mits-data:
